<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" aria-label="Sri Advaita Educational Trust Animated Crest">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb752" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#8f6c10" />
    </linearGradient>

    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#133259" />
      <stop offset="100%" stop-color="#071830" />
    </linearGradient>

    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="50%" stop-color="#dfb752" />
      <stop offset="100%" stop-color="#c59b27" />
    </linearGradient>

    <!-- Drop Shadows / Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="goldShine" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* ─── Animated Logo Styles ─── */
    .anim-ring {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawRing 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    .anim-laurel {
      opacity: 0;
      transform-origin: 250px 250px;
      animation: bloomLaurel 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    }

    .anim-star {
      transform-origin: 250px 115px;
      animation: pulseStar 2s ease-in-out infinite, appearStar 0.8s ease-out 0.8s forwards;
      opacity: 0;
    }

    .anim-rays {
      opacity: 0;
      animation: fadeInRays 1.2s ease-out 0.5s forwards, rotateRays 20s linear infinite;
      transform-origin: 250px 175px;
    }

    .anim-figures {
      opacity: 0;
      transform: translateY(12px);
      animation: riseFigures 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .anim-book {
      opacity: 0;
      transform-origin: 250px 260px;
      animation: openBook 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
    }

    .anim-infinity {
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
      animation: drawInfinity 1.5s ease-out 0.9s forwards;
    }

    .anim-ribbon {
      opacity: 0;
      transform: translateY(10px);
      animation: riseRibbon 0.9s ease-out 1s forwards;
    }

    .anim-text {
      opacity: 0;
      animation: fadeInText 0.8s ease-out 1.2s forwards;
    }

    @keyframes drawRing {
      to { stroke-dashoffset: 0; }
    }

    @keyframes bloomLaurel {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes appearStar {
      to { opacity: 1; }
    }

    @keyframes pulseStar {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #dfb752); }
      50% { transform: scale(1.18); filter: drop-shadow(0 0 8px #ffd966); }
    }

    @keyframes fadeInRays {
      to { opacity: 0.75; }
    }

    @keyframes rotateRays {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes riseFigures {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes openBook {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes drawInfinity {
      to { stroke-dashoffset: 0; }
    }

    @keyframes riseRibbon {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInText {
      to { opacity: 1; }
    }
  </style>

  <!-- Background Clean White Disk -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" />

  <!-- 1. Outer Laurel Leaves (Navy Blue) -->
  <g class="anim-laurel" fill="#0b2240">
    <!-- Left Laurel Wreath -->
    <path d="M125 105 C115 115 110 135 112 145 C102 140 92 148 90 160 C78 152 70 165 72 178 C60 172 52 186 55 200 C45 198 38 212 42 226 C32 228 28 242 35 256 C28 262 26 276 34 290 C30 300 32 312 42 322 C40 332 46 345 58 352 C60 365 72 374 85 378 C90 390 105 398 120 398 C115 385 105 375 100 360 C80 310 75 250 102 195 C112 175 125 155 125 105 Z" opacity="0.95" />
    <path d="M110 120 C95 140 85 170 82 205 C80 245 88 285 108 325 C115 340 125 355 138 370" fill="none" stroke="#0b2240" stroke-width="4" stroke-linecap="round" />

    <!-- Right Laurel Wreath -->
    <path d="M375 105 C385 115 390 135 388 145 C398 140 408 148 410 160 C422 152 430 165 428 178 C440 172 448 186 445 200 C455 198 462 212 458 226 C468 228 472 242 465 256 C472 262 474 276 466 290 C470 300 468 312 458 322 C460 332 454 345 442 352 C440 365 428 374 415 378 C410 390 395 398 380 398 C385 385 395 375 400 360 C420 310 425 250 398 195 C388 175 375 155 375 105 Z" opacity="0.95" />
    <path d="M390 120 C405 140 415 170 418 205 C420 245 412 285 392 325 C385 340 375 355 362 370" fill="none" stroke="#0b2240" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 2. Concentric Circles (Animated Draw) -->
  <circle class="anim-ring" cx="250" cy="250" r="195" fill="none" stroke="#0b2240" stroke-width="5" />
  <circle class="anim-ring" cx="250" cy="250" r="185" fill="none" stroke="#c59b27" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85" />
  <circle class="anim-ring" cx="250" cy="250" r="176" fill="none" stroke="#0b2240" stroke-width="2" />

  <!-- 3. Golden Sunburst Rays behind Children -->
  <g class="anim-rays" stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round">
    <line x1="250" y1="175" x2="250" y2="70" />
    <line x1="250" y1="175" x2="275" y2="75" />
    <line x1="250" y1="175" x2="300" y2="85" />
    <line x1="250" y1="175" x2="322" y2="102" />
    <line x1="250" y1="175" x2="340" y2="125" />
    <line x1="250" y1="175" x2="352" y2="150" />
    <line x1="250" y1="175" x2="225" y2="75" />
    <line x1="250" y1="175" x2="200" y2="85" />
    <line x1="250" y1="175" x2="178" y2="102" />
    <line x1="250" y1="175" x2="160" y2="125" />
    <line x1="250" y1="175" x2="148" y2="150" />
  </g>

  <!-- 4. Five-Pointed Star at Center Apex -->
  <polygon
    class="anim-star"
    points="250,96 256,112 272,112 259,122 264,138 250,128 236,138 241,122 228,112 244,112"
    fill="url(#starGlow)"
    stroke="#8f6c10"
    stroke-width="1.2"
    filter="url(#glow)"
  />

  <!-- 5. Children Figures (Boy on Left, Girl on Right reaching for the star) -->
  <g class="anim-figures" fill="#0b2240">
    <!-- Boy Head -->
    <circle cx="212" cy="155" r="13" />
    <!-- Boy Body & Raised Arms touching star -->
    <path d="M210 168 C195 178 185 195 192 222 C195 235 208 242 222 242 C228 220 232 195 248 145 L242 142 C232 165 222 180 215 170 Z" />

    <!-- Central Spires / Upward Vector -->
    <polygon points="250,135 245,245 250,240 255,245" fill="#071830" />
    <polygon points="248,140 240,245 248,242" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Girl Head with ponytail -->
    <circle cx="288" cy="155" r="13" />
    <path d="M298 152 C308 148 314 158 310 170 C306 172 300 168 298 160 Z" />
    <!-- Girl Body & Raised Arms touching star -->
    <path d="M290 168 C305 178 312 195 306 222 C302 235 292 242 278 242 C272 220 268 195 252 145 L258 142 C268 165 278 180 285 170 Z" />
  </g>

  <!-- 6. Icons: Globe on Left, Lightbulb on Right -->
  <!-- Globe (Left) -->
  <g class="anim-figures" stroke="#c59b27" stroke-width="2.5" fill="none">
    <circle cx="165" cy="205" r="24" stroke="#c59b27" stroke-width="2.5" fill="#ffffff" />
    <ellipse cx="165" cy="205" rx="13" ry="24" />
    <line x1="141" y1="205" x2="189" y2="205" />
    <line x1="145" y1="193" x2="185" y2="193" />
    <line x1="145" y1="217" x2="185" y2="217" />
  </g>

  <!-- Lightbulb (Right) -->
  <g class="anim-figures" stroke="#c59b27" stroke-width="2.2" fill="none">
    <path d="M335 190 A16 16 0 0 1 349 206 C349 214 343 218 341 223 L329 223 C327 218 321 214 321 206 A16 16 0 0 1 335 190 Z" fill="#ffffff" />
    <line x1="330" y1="227" x2="340" y2="227" stroke-width="2.5" />
    <line x1="332" y1="231" x2="338" y2="231" stroke-width="2" />
    <!-- Lightbulb Filament & Rays -->
    <path d="M331 208 L335 200 L339 208" stroke="#0b2240" stroke-width="1.8" />
    <line x1="335" y1="183" x2="335" y2="178" />
    <line x1="352" y1="193" x2="357" y2="189" />
    <line x1="318" y1="193" x2="313" y2="189" />
  </g>

  <!-- 7. Open Knowledge Book with Fan Pages -->
  <g class="anim-book" fill="#0b2240">
    <!-- Left Wing Pages -->
    <path d="M250 248 C205 235 160 245 135 268 C175 255 215 255 250 270 Z" />
    <path d="M250 255 C210 245 170 252 145 275 C185 264 220 264 250 278 Z" fill="#133259" />
    <path d="M250 262 C215 255 180 260 155 282 C190 274 225 274 250 285 Z" />

    <!-- Right Wing Pages -->
    <path d="M250 248 C295 235 340 245 365 268 C325 255 285 255 250 270 Z" />
    <path d="M250 255 C290 245 330 252 355 275 C315 264 280 264 250 278 Z" fill="#133259" />
    <path d="M250 262 C285 255 320 260 345 282 C310 274 275 274 250 285 Z" />
  </g>

  <!-- 8. Golden Infinity Loop / Base Ribbon -->
  <path
    class="anim-infinity"
    d="M250 285 C220 285 190 275 160 275 C130 275 120 295 135 308 C155 322 210 315 250 290 C290 315 345 322 365 308 C380 295 370 275 340 275 C310 275 280 285 250 285 Z"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="5"
    stroke-linecap="round"
    filter="url(#goldShine)"
  />

  <!-- 9. Institutional Typography -->
  <!-- "SRI" -->
  <g class="anim-text" fill="#0b2240">
    <line x1="170" y1="316" x2="215" y2="316" stroke="#c59b27" stroke-width="2" />
    <text x="250" y="322" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">
      SRI
    </text>
    <line x1="285" y1="316" x2="330" y2="316" stroke="#c59b27" stroke-width="2" />

    <!-- "ADVAITA" -->
    <text x="250" y="362" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="800" letter-spacing="3" text-anchor="middle" fill="#071830">
      ADVAITA
    </text>

    <!-- "EDUCATIONAL TRUST (R)" -->
    <text x="250" y="386" font-family="'Inter', sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#0b2240">
      EDUCATIONAL TRUST (R)
    </text>

    <!-- Gold Accent Diamond -->
    <circle cx="250" cy="402" r="3.5" fill="#c59b27" />
    <line x1="180" y1="402" x2="240" y2="402" stroke="#c59b27" stroke-width="1.5" />
    <line x1="260" y1="402" x2="320" y2="402" stroke="#c59b27" stroke-width="1.5" />
  </g>

  <!-- 10. Bottom Navy Curved Banner -->
  <g class="anim-ribbon">
    <!-- Ribbon Tails -->
    <polygon points="62,382 92,398 90,432 50,422 68,402" fill="#071830" />
    <polygon points="438,382 408,398 410,432 450,422 432,402" fill="#071830" />

    <!-- Main Ribbon Arc -->
    <path
      id="ribbonArc"
      d="M75 390 C150 440 350 440 425 390 L445 422 C360 478 140 478 55 422 Z"
      fill="url(#navyGrad)"
      stroke="#c59b27"
      stroke-width="2.5"
    />

    <!-- Invisible Text Path for Curving Lettering -->
    <path
      id="textArc"
      d="M85 416 C160 460 340 460 415 416"
      fill="none"
      stroke="none"
    />

    <!-- "CONTINUOUS AND INNOVATIVE LEARNING" along Ribbon Arc -->
    <text fill="url(#goldGrad)" font-family="'Inter', sans-serif" font-size="13" font-weight="800" letter-spacing="2.8">
      <textPath href="#textArc" startOffset="50%" text-anchor="middle">
        CONTINUOUS AND INNOVATIVE LEARNING
      </textPath>
    </text>
  </g>
</svg>